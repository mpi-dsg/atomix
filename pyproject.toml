[project]
name = "atomix"
version = "0.0.1"
description = "Atomix: transactional tool semantics with frontier-aligned commits for agent orchestrators."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["agents", "llm", "transactions", "tool-use", "reliability"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/mpi-dsg/atomix"
Repository = "https://github.com/mpi-dsg/atomix"
Issues = "https://github.com/mpi-dsg/atomix/issues"

[project.scripts]
atomix = "atomix.__main__:main"

[project.optional-dependencies]
checker = ["PyYAML>=6.0.0"]
dev = ["pytest>=8.3.0", "pytest-asyncio>=0.23.0", "pytest-cov>=5.0.0", "PyYAML>=6.0.0"]
langgraph = ["langgraph>=0.1.19"]
plots = ["matplotlib>=3.7.0"]
sinks = ["aiosmtpd>=1.4.6", "fastapi>=0.115.0", "uvicorn>=0.30.0"]
llm = ["anthropic>=0.40.0", "openai>=1.0.0"]
osworld = ["anthropic>=0.40.0", "httpx>=0.27.0"]
webarena = ["openai>=1.0.0"]
swebench = ["datasets>=2.18", "swebench @ git+https://github.com/princeton-nlp/SWE-bench.git"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"atomix.checker" = ["alias_suite.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["atomix"]
omit = [
    "src/atomix/integrations/workloads/osworld/real/*.py",
    "src/atomix/integrations/workloads/osworld/real/adapters/*.py",
    "src/atomix/integrations/workloads/osworld/real/tasks/*.py",
]

[tool.coverage.report]
fail_under = 80
show_missing = true
